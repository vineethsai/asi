<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme bootstrap: apply the stored/system theme before first paint (no light flash).
         Keep the storage key in sync with src/components/layout/ThemeProvider.tsx. -->
    <script>
      (function () {
        var root = document.documentElement;
        var dark = false;
        try {
          var stored = localStorage.getItem("theme");
          dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        try {
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            root.classList.add("motion-ok");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131316" />

    <!-- Fonts are requested before any stylesheet so text never waits on late font discovery. -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>OWASP Agentic AI Security: AI Agent Threats, AISVS &amp; Threat Modeling · Agentic Security Hub</title>
    <!-- Tags marked data-react-helmet are defaults that react-helmet replaces per route.
         scripts/prerender.mjs swaps them for each route's own tags in the built HTML. -->
    <meta
      data-react-helmet="true"
      name="description"
      content="OWASP-aligned guide to agentic AI security: AI agent threats and controls, OWASP AISVS requirements, NIST AI RMF mapping and a free in-browser threat modeler."
    />
    <meta
      data-react-helmet="true"
      name="keywords"
      content="AI agents security, agentic AI security, OWASP, AISVS, NIST AI RMF, AI security controls, AI agent threats, threat modeling, LLM security"
    />
    <meta name="author" content="OWASP Securing Agentic Applications" />
    <meta data-react-helmet="true" name="robots" content="index, follow, max-image-preview:large" />
    <link data-react-helmet="true" rel="canonical" href="https://agenticsecurity.info/" />

    <meta data-react-helmet="true" property="og:site_name" content="Agentic Security Hub" />
    <meta data-react-helmet="true" property="og:type" content="website" />
    <meta data-react-helmet="true" property="og:title" content="Agentic Security Hub" />
    <meta
      data-react-helmet="true"
      property="og:description"
      content="Interactive guide to securing agentic AI applications with OWASP threats, AISVS, NIST AI RMF mapping and a threat modeler."
    />
    <meta data-react-helmet="true" property="og:url" content="https://agenticsecurity.info/" />
    <meta
      data-react-helmet="true"
      property="og:image"
      content="https://agenticsecurity.info/og/home.png"
    />
    <meta data-react-helmet="true" property="og:image:width" content="1200" />
    <meta data-react-helmet="true" property="og:image:height" content="630" />

    <meta data-react-helmet="true" name="twitter:card" content="summary_large_image" />
    <meta data-react-helmet="true" name="twitter:title" content="Agentic Security Hub" />
    <meta
      data-react-helmet="true"
      name="twitter:description"
      content="Interactive guide to securing agentic AI applications with OWASP threats, AISVS, NIST AI RMF mapping and a threat modeler."
    />
    <meta
      data-react-helmet="true"
      name="twitter:image"
      content="https://agenticsecurity.info/og/home.png"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google tag (gtag.js). Page views are sent by src/hooks/useAnalytics.ts, one per navigation. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FB1F73HMB5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-FB1F73HMB5", { send_page_view: false });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
